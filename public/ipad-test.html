<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>iPad JavaScript Test</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #020617; color: #fff; }
      main { width: min(90vw, 720px); padding: 32px; text-align: center; border-radius: 24px; background: #0f172a; }
      h1 { font-size: 32px; }
      #clock { margin: 32px 0; font-size: 48px; font-weight: 800; }
      button { min-height: 64px; width: 100%; border: 0; border-radius: 16px; background: #7e22ce; color: #fff; font-size: 28px; font-weight: 800; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <main>
      <h1>iPad JavaScript Test</h1>
      <p id="clock">--:--:--</p>
      <button id="counter" type="button">カウント: 0</button>
    </main>
    <script>
      (function () {
        var count = 0;
        var clock = document.getElementById("clock");
        var counter = document.getElementById("counter");

        function updateClock() {
          clock.textContent = new Date().toLocaleTimeString("ja-JP");
        }

        counter.addEventListener("click", function () {
          count += 1;
          counter.textContent = "カウント: " + count;
        });

        updateClock();
        window.setInterval(updateClock, 1000);
      })();
    </script>
  </body>
</html>
